version: "1.0"
generated_by: constrain
session_id: herald_webhook_relay_001
system: Herald

trust:
  floor: 0.15
  authority_override_floor: 0.50
  decay_lambda: 0.05
  taint_lock_tiers: [PII, FINANCIAL, AUTH, COMPLIANCE]
  conflict_trust_delta_threshold: 0.25

classifications:
  - field_pattern: "webhook_body"
    tier: PII
    authoritative_component: "crypto_module"
    canary_eligible: false
    canary_pattern: null
    rationale: "Webhook bodies may contain user data, require BYOK encryption"
  
  - field_pattern: "webhook_headers"
    tier: AUTH
    authoritative_component: "ingest_module"
    canary_eligible: true
    canary_pattern: "authorization|signature|x-hub-signature"
    rationale: "Headers contain authentication tokens and signatures"
  
  - field_pattern: "api_key"
    tier: AUTH
    authoritative_component: "ingest_module"
    canary_eligible: false
    canary_pattern: null
    rationale: "API keys provide system access"
  
  - field_pattern: "message_id"
    tier: PUBLIC
    authoritative_component: "ingest_module"
    canary_eligible: true
    canary_pattern: "msg_"
    rationale: "Content-addressable IDs are not sensitive"
  
  - field_pattern: "rate_limit_config"
    tier: COMPLIANCE
    authoritative_component: "queue_module"
    canary_eligible: false
    canary_pattern: null
    rationale: "Rate limits enforce SLA compliance and tier boundaries"

soak:
  base_durations:
    PUBLIC: 1h
    PII: 6h
    FINANCIAL: 24h
    AUTH: 48h
    COMPLIANCE: 72h
  target_requests: 1000

authority_map:
  - component: "ingest_module"
    domains: ["webhook_headers", "api_key", "message_id", "rate_validation"]
    rationale: "Owns webhook ingestion pipeline and initial validation"
  
  - component: "crypto_module"
    domains: ["webhook_body", "encryption_keys", "plaintext_isolation"]
    rationale: "Owns BYOK encryption and plaintext protection guarantees"
  
  - component: "queue_module"
    domains: ["message_ordering", "visibility_timeout", "delivery_count"]
    rationale: "Owns message queuing semantics and delivery guarantees"
  
  - component: "queue_module"
    domains: ["rate_limit_config", "tier_boundaries", "abuse_detection"]
    rationale: "Owns tier isolation and system protection"

human_gates:
  always:
    - tier: FINANCIAL
    - tier: AUTH
    - tier: COMPLIANCE
  on_low_trust_authoritative: true
  on_unresolvable_conflict: true