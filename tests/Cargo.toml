[package]
name = "herald-smoke-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "API-drift smoke tests for the herald workspace. Each test verifies that the source files pact decomposed still exist and still expose the public symbols pact captured. Intended as a fast pre-push gate complementing the inline unit tests."

# tests/ is its own (test-only) workspace member crate. We don't ship a library
# or binary; lib.rs is empty.

[lib]
path = "src/lib.rs"

# Each [[test]] entry below preserves pact-adopt's original filename under
# smoke/ while giving cargo a valid Rust binary name (no hyphens).

[[test]]
name = "smoke_herald_cli_src"
path = "smoke/test_herald-cli_src.rs"

[[test]]
name = "smoke_herald_cli_src_client"
path = "smoke/test_herald-cli_src_client.rs"

