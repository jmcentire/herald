- id: C001
  boundary: "Message encryption"
  condition: "Herald MUST never access plaintext message body after encryption step"
  violation: "Plaintext body visible to Herald components post-encryption"
  severity: must
  rationale: "Core BYOK security guarantee"
  classification_tier: PII
  affected_components: ["crypto_module", "queue_module", "agent_module"]

- id: C002
  boundary: "Message ordering"
  condition: "Messages within single endpoint MUST be delivered in FIFO order"
  violation: "Messages delivered out of order within endpoint"
  severity: must
  rationale: "Webhook processing often depends on event ordering"
  classification_tier: null
  affected_components: ["queue_module"]

- id: C003
  boundary: "Single authoritative backend"
  condition: "Exactly one storage backend MUST be authoritative per running herald-server instance"
  violation: "Multiple backends serve conflicting state for the same message_id"
  severity: must
  rationale: "There is no multi-backend coherence layer; the spec's pluggable backends are swappable adapters, not simultaneous. Production runs Redis only."
  classification_tier: null
  affected_components: ["queue_module", "redis"]

- id: C004
  boundary: "Tier isolation"
  condition: "Free tier abuse MUST NOT degrade paid tier service"
  violation: "Free tier load impacts paid tier response times or availability"
  severity: must
  rationale: "Revenue protection and SLA compliance"
  classification_tier: null
  affected_components: ["ingest_module", "queue_module"]

- id: C005
  boundary: "Content addressable IDs"
  condition: "Message IDs MUST be content-addressable for deduplication"
  violation: "Identical payloads receive different message IDs"
  severity: must
  rationale: "Enables built-in deduplication within retention window"
  classification_tier: null
  affected_components: ["ingest_module"]

- id: C006
  boundary: "Visibility timeout"
  condition: "Messages MUST become visible again after timeout if not ACKed"
  violation: "Messages permanently invisible without ACK or become visible before timeout"
  severity: must
  rationale: "Ensures message delivery despite agent failures"
  classification_tier: null
  affected_components: ["queue_module", "agent_module"]

- id: C007
  boundary: "Rate limiting"
  condition: "Rate limits MUST be enforced at ingestion edge per tier"
  violation: "Requests exceed tier limits without HTTP 429 response"
  severity: must
  rationale: "Prevents system overload and ensures tier boundaries"
  classification_tier: null
  affected_components: ["ingest_module", "queue_module"]

- id: C008
  boundary: "Header preservation"
  condition: "Webhook headers SHOULD be preserved for signature verification"
  violation: "Headers modified or lost, preventing agent signature verification"
  severity: should
  rationale: "Required for webhook authenticity verification"
  classification_tier: AUTH
  affected_components: ["ingest_module", "redis"]

- id: C009
  boundary: "Binary compatibility"
  condition: "System MUST compile to single static binary"
  violation: "Deployment requires multiple binaries or dynamic dependencies"
  severity: must
  rationale: "Simplifies deployment and meets cross-platform requirement"
  classification_tier: null
  affected_components: ["all"]

- id: C010
  boundary: "Delivery semantics"
  condition: "System MUST provide at-least-once delivery guarantees"
  violation: "Messages enqueued but never delivered to any agent before retention expires"
  severity: must
  rationale: "Webhook reliability — agents implement idempotency to handle the duplicates this admits. Exactly-once is impossible in distributed systems (FLP)."
  classification_tier: null
  affected_components: ["queue_module", "agent_module", "websocket_module"]